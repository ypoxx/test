<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Gold-Pack">
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset=".34" stop-color="#FFCB2D"/>
      <stop offset=".66" stop-color="#B8860B"/>
      <stop offset=".86" stop-color="#E8B93B"/>
      <stop offset="1" stop-color="#FFDF74"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1E44"/>
      <stop offset=".55" stop-color="#071331"/>
      <stop offset="1" stop-color="#040B20"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6D8"/>
      <stop offset=".55" stop-color="#FFCB2D"/>
      <stop offset="1" stop-color="#C8940E"/>
    </linearGradient>
    <linearGradient id="blueField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1173C9"/>
      <stop offset="1" stop-color="#0A3E86"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#FFD66E" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#FFCB2D" stop-opacity=".10"/>
      <stop offset="1" stop-color="#FFCB2D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <rect width="26" height="26" fill="none"/>
      <rect width="11" height="26" fill="#FFFFFF" opacity=".045"/>
    </pattern>
    <clipPath id="bodyClip"><rect x="23" y="31" width="254" height="344" rx="7"/></clipPath>
    <clipPath id="shieldClip">
      <path d="M60 11 L106 23 V61 C106 90 88 112 60 126 C32 112 14 90 14 61 V23 Z"/>
    </clipPath>
    <clipPath id="headClip">
      <path d="M28 88 C24 84 23 78 25 73 C27 66 32 57 38 50 C43 43 48 37 54 33 L57 31 L60 16 L66 29 C74 32 80 39 84 50 C89 63 91 82 91 100 L91 130 L50 130 C50 112 46 99 39 94 C34 90 30 90 28 88 Z"/>
    </clipPath>
  </defs>

  <!-- ===== Pack-Korpus: Gold-Rahmen + Nachtblau ===== -->
  <rect x="18" y="26" width="264" height="354" rx="10" fill="url(#foil)"/>
  <rect x="23" y="31" width="254" height="344" rx="7" fill="url(#navy)"/>
  <g clip-path="url(#bodyClip)">
    <rect x="23" y="31" width="254" height="344" fill="url(#stripes)"/>
    <ellipse cx="150" cy="160" rx="150" ry="140" fill="url(#glow)"/>
  </g>
  <rect x="31" y="39" width="238" height="328" rx="5" fill="none" stroke="#FFCB2D" stroke-opacity=".35" stroke-width="1"/>

  <!-- ===== Crimp-Kante oben ===== -->
  <path fill="url(#foil)" d="M22 30 L22 16 L30 8 L38 16 L46 8 L54 16 L62 8 L70 16 L78 8 L86 16 L94 8 L102 16 L110 8 L118 16 L126 8 L134 16 L142 8 L150 16 L158 8 L166 16 L174 8 L182 16 L190 8 L198 16 L206 8 L214 16 L222 8 L230 16 L238 8 L246 16 L254 8 L262 16 L270 8 L278 16 L278 30 Z"/>
  <rect x="22" y="26" width="256" height="3" fill="#5C3E06" opacity=".55"/>
  <!-- ===== Crimp-Kante unten ===== -->
  <path fill="url(#foil)" d="M22 372 L278 372 L278 386 L270 394 L262 386 L254 394 L246 386 L238 394 L230 386 L222 394 L214 386 L206 394 L198 386 L190 394 L182 386 L174 394 L166 386 L158 394 L150 386 L142 394 L134 386 L126 394 L118 386 L110 394 L102 386 L94 394 L86 386 L78 394 L70 386 L62 394 L54 386 L46 394 L38 386 L30 394 L22 386 Z"/>
  <rect x="22" y="373" width="256" height="3" fill="#5C3E06" opacity=".55"/>

  <!-- ===== Kicker ===== -->
  <text x="152" y="64" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="4" fill="#AFC4E8">MSV DUISBURG</text>

  <!-- ===== Zebra-Wappen ===== -->
  <g transform="translate(90 80)">
    <!-- Schild -->
    <path d="M60 4 L112 18 V62 C112 95 91 119 60 134 C29 119 8 95 8 62 V18 Z" fill="url(#foil)" stroke="#061127" stroke-width="2"/>
    <path d="M60 11 L106 23 V61 C106 90 88 112 60 126 C32 112 14 90 14 61 V23 Z" fill="url(#blueField)"/>
    <path d="M60 11 L106 23 V61 C106 90 88 112 60 126 Z" fill="#05224E" opacity=".18"/>
    <g clip-path="url(#shieldClip)">
      <!-- Kopf-Silhouette -->
      <path fill="#F5F9FF" d="M28 88 C24 84 23 78 25 73 C27 66 32 57 38 50 C43 43 48 37 54 33 L57 31 L60 16 L66 29 C74 32 80 39 84 50 C89 63 91 82 91 100 L91 130 L50 130 C50 112 46 99 39 94 C34 90 30 90 28 88 Z"/>
      <!-- Hals-/Gesichtsstreifen -->
      <g clip-path="url(#headClip)" fill="none" stroke="#0A1F44" stroke-linecap="round">
        <path d="M44 132 Q49 108 62 96" stroke-width="6.5"/>
        <path d="M57 132 Q61 114 72 102" stroke-width="6.5"/>
        <path d="M70 132 Q73 118 82 108" stroke-width="6.5"/>
        <path d="M45 80 Q52 74 56 64" stroke-width="4.5"/>
        <path d="M36 57 Q42 60 46 66" stroke-width="3.2"/>
        <path d="M31 66 Q37 68 41 74" stroke-width="3.2"/>
      </g>
      <!-- Mähne: Zackenband entlang des Halses -->
      <path fill="#0A1F44" d="M64 27 C72 31 78.5 40 82 51 C86.5 63.5 88.5 82 88.5 100 L88.5 130 L77 130 L80 112 L72 109 L77 96 L69 93 L74 80 L66 77 L71 64 L63 61 L68 49 L59 45 L64 36 L57 33 L57 31 L60 16 L66 29 Z"/>
      <!-- Ohr innen -->
      <path d="M58.5 28 L60.5 20 L64.5 27.5 Z" fill="#F5F9FF"/>
      <!-- Maul -->
      <path fill="#0A1F44" d="M28 88 C24 84 23 78 25 73 C26 69 28 65 31 61 C36 63.5 40 69 41 75 C42 83 37 89 31.5 89 Z"/>
      <circle cx="30" cy="74" r="1.7" fill="#4E7FD8"/>
      <!-- Auge -->
      <circle cx="47.5" cy="47" r="2.7" fill="#0A1F44"/>
      <circle cx="48.5" cy="46" r=".9" fill="#F5F9FF"/>
    </g>
  </g>

  <!-- ===== Wortmarke ===== -->
  <text x="152" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="900" font-style="italic" letter-spacing="3" fill="url(#txt)">ZEBRA</text>
  <text x="152" y="322" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="900" font-style="italic" letter-spacing="8" fill="url(#txt)">PACK</text>
  <path d="M60 338 H240" stroke="url(#foil)" stroke-width="1.4" opacity=".8"/>
  <text x="152" y="358" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="5" fill="#D9C77E">GOLD-EDITION</text>
</svg>
